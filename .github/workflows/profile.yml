name: Profile stats

# Rebuilds the high-score card and contribution snake, then force-pushes them to
# the `output` branch that README.md reads from. Nothing is committed to main.
on:
  schedule:
    - cron: "23 2 * * *" # daily, 07:53 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: High-score card
        run: python3 tools/stats.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffec27&color_dots=#15142b,#1d2b53,#008751,#00e436,#ffa300
            dist/snake-light.svg?palette=github-light&color_snake=#ff004d&color_dots=#ebedf0,#c2c3c7,#00e436,#008751,#ffa300

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update profile stats"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
