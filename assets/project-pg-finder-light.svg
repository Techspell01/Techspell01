<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-labelledby="title desc">
<title id="title">PG Finder</title>
<desc id="desc">Search · Student Housing. Student housing search that replaces a pile of WhatsApp forwards and dead phone numbers with one box. Built with React, TypeScript, Tailwind, Gemini.</desc>
<style><![CDATA[
@font-face{font-family:'HA Mono';font-weight:500;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'HA Title';font-weight:700;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'HA Sans';font-weight:400;src:url(data:font/woff;base64,) format('woff')}

text{font-kerning:normal}
.f-display{font-family:'HA Display','Trebuchet MS',system-ui,sans-serif;font-weight:800}
.f-title{font-family:'HA Title','Trebuchet MS',system-ui,sans-serif;font-weight:700}
.f-sans{font-family:'HA Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400}
.f-semi{font-family:'HA Semi',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.f-mono{font-family:'HA Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.2,.8,.3,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}75%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.glare{animation:glare 9s ease-in-out 2.4s infinite}@keyframes glare{0%{transform:skewX(-18deg) translateX(0)}16%,100%{transform:skewX(-18deg) translateX(740px)}}
]]></style>
<defs><linearGradient id="tint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4263eb" stop-opacity=".13"/><stop offset=".6" stop-color="#4263eb" stop-opacity=".02"/></linearGradient></defs><rect x=".5" y=".5" width="419" height="199" rx="18" fill="#fbfbfe"/><rect x=".5" y=".5" width="419" height="199" rx="18" fill="url(#tint)"/><rect x=".5" y=".5" width="419" height="199" rx="18" fill="none" stroke="#4263eb" stroke-opacity=".35"/>
<defs><clipPath id="cc"><rect x=".5" y=".5" width="419" height="199" rx="18"/></clipPath><linearGradient id="glare" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#cc)"><rect class="glare" x="-160" y="-40" width="120" height="280" fill="url(#glare)" transform="skewX(-18)"/><circle cx="390" cy="210" r="90" fill="#4263eb" fill-opacity="0.07"/></g>
<text class="f-mono" x="24" y="38" style="font-size:10.5px;letter-spacing:1.2px" fill="#3147a2">SEARCH · STUDENT HOUSING</text>
<rect x="340" y="22" width="56" height="22" rx="11" fill="#0f9d68" fill-opacity=".13" stroke="#0f9d68" stroke-opacity=".4"/><circle cx="352" cy="33" r="3" fill="#0f9d68"/><circle class="ping" style="animation-delay:0.6s" cx="352" cy="33" r="3" fill="none" stroke="#0f9d68"/><text class="f-mono" x="361" y="37" style="font-size:9.5px;letter-spacing:0.8px" fill="#0f9d68">LIVE</text>
<text class="f-title" x="23" y="80" style="font-size:25px;letter-spacing:-0.3px" fill="#13151f">PG Finder</text>
<text class="f-sans" x="24" y="106" style="font-size:13.5px" fill="#3d4256">Student housing search that replaces a pile of WhatsApp</text><text class="f-sans" x="24" y="125.5" style="font-size:13.5px" fill="#3d4256">forwards and dead phone numbers with one box.</text>
<g><rect x="24" y="156" width="49.5" height="22" rx="11.0" fill="#4263eb" fill-opacity="0.12" stroke="#4263eb" stroke-opacity=".32"/><text class="f-mono" x="48.75" y="170.78" style="font-size:10.5px" fill="#3147a2" text-anchor="middle">React</text></g><g><rect x="79.5" y="156" width="81" height="22" rx="11.0" fill="#4263eb" fill-opacity="0.12" stroke="#4263eb" stroke-opacity=".32"/><text class="f-mono" x="120" y="170.78" style="font-size:10.5px" fill="#3147a2" text-anchor="middle">TypeScript</text></g><g><rect x="166.5" y="156" width="68.4" height="22" rx="11.0" fill="#4263eb" fill-opacity="0.12" stroke="#4263eb" stroke-opacity=".32"/><text class="f-mono" x="200.7" y="170.78" style="font-size:10.5px" fill="#3147a2" text-anchor="middle">Tailwind</text></g><g><rect x="240.9" y="156" width="55.8" height="22" rx="11.0" fill="#4263eb" fill-opacity="0.12" stroke="#4263eb" stroke-opacity=".32"/><text class="f-mono" x="268.8" y="170.78" style="font-size:10.5px" fill="#3147a2" text-anchor="middle">Gemini</text></g>
</svg>
