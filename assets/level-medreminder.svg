<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-labelledby="title desc">
<title id="title">WORLD 1-3: Medreminder Circle</title>
<desc id="desc">Live. Medication reminders shared with the family members who would notice a missed dose. Power-ups: React, Firebase, PWA.</desc>
<style><![CDATA[
@font-face{font-family:'Press Start 2P';font-weight:400;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'VT323';font-weight:400;src:url(data:font/woff;base64,) format('woff')}

.f-pixel{font-family:'Press Start 2P',ui-monospace,Consolas,monospace;font-weight:400}
.f-body{font-family:'VT323',ui-monospace,Consolas,monospace;font-weight:400}
.px{shape-rendering:crispEdges}
.blink{animation:blink 1s steps(1) infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s steps(3) both}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.float{animation:float 1.6s steps(1) infinite}@keyframes float{50%{transform:translateY(-4px)}}
]]></style>
