<svg xmlns="http://www.w3.org/2000/svg" width="160" height="50" viewBox="0 0 160 50" role="img" aria-labelledby="title desc">
<title id="title">LinkedIn</title>
<desc id="desc">LinkedIn link</desc>
<style><![CDATA[
@font-face{font-family:'HA Semi';font-weight:600;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'HA Sans';font-weight:400;src:url(data:font/woff;base64,) format('woff')}

text{font-kerning:normal}
.f-display{font-family:'HA Display','Trebuchet MS',system-ui,sans-serif;font-weight:800}
.f-title{font-family:'HA Title','Trebuchet MS',system-ui,sans-serif;font-weight:700}
.f-sans{font-family:'HA Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400}
.f-semi{font-family:'HA Semi',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.f-mono{font-family:'HA Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.2,.8,.3,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}75%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.sh{animation:sh 7s ease-in-out 1.55s infinite}@keyframes sh{0%{transform:skewX(-20deg) translateX(0)}18%,100%{transform:skewX(-20deg) translateX(320px)}}.arrow{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(3px)}}
]]></style>
<defs><clipPath id="bc"><rect x=".5" y=".5" width="159" height="49" rx="15"/></clipPath><linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x=".5" y=".5" width="159" height="49" rx="15" fill="#ffffff"/>
<rect x=".5" y=".5" width="159" height="49" rx="15" fill="#4263eb" fill-opacity="0.07"/>
<g clip-path="url(#bc)"><rect class="sh" x="-70" y="-10" width="60" height="70" fill="url(#sheen)" transform="skewX(-20)"/></g>
<rect x=".5" y=".5" width="159" height="49" rx="15" fill="none" stroke="#4263eb" stroke-opacity=".35"/>
<circle cx="26" cy="25" r="15" fill="#4263eb" fill-opacity="0.15"/>
<g transform="translate(17 16) scale(.75)" fill="none" stroke="#3147a2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 11v6M8 7.5v.01M12 17v-6M12 13.5a2.5 2.5 0 0 1 5 0V17"/></g>
<text class="f-semi" x="52" y="30" style="font-size:15px" fill="#13151f">LinkedIn</text>
<g class="arrow"><text class="f-sans" x="123.16" y="30" style="font-size:15px" fill="#3147a2">→</text></g>
</svg>
