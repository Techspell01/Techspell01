<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-labelledby="title desc">
<title id="title">Campus Hub</title>
<desc id="desc">Full-Stack · Postgres. Events, QR ticketing and volunteer duty rosters for a college, with check-in codes that rotate every 30 seconds. Built with Next.js 16, TypeScript, PostgreSQL, Drizzle.</desc>
<style><![CDATA[
@font-face{font-family:'HA Mono';font-weight:500;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'HA Title';font-weight:700;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'HA Sans';font-weight:400;src:url(data:font/woff;base64,) format('woff')}

text{font-kerning:normal}
.f-display{font-family:'HA Display','Trebuchet MS',system-ui,sans-serif;font-weight:800}
.f-title{font-family:'HA Title','Trebuchet MS',system-ui,sans-serif;font-weight:700}
.f-sans{font-family:'HA Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400}
.f-semi{font-family:'HA Semi',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.f-mono{font-family:'HA Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.2,.8,.3,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}75%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.glare{animation:glare 9s ease-in-out 1s infinite}@keyframes glare{0%{transform:skewX(-18deg) translateX(0)}16%,100%{transform:skewX(-18deg) translateX(740px)}}
]]></style>
<defs><linearGradient id="tint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0fa896" stop-opacity=".13"/><stop offset=".6" stop-color="#0fa896" stop-opacity=".02"/></linearGradient></defs><rect x=".5" y=".5" width="419" height="199" rx="18" fill="#10131b"/><rect x=".5" y=".5" width="419" height="199" rx="18" fill="url(#tint)"/><rect x=".5" y=".5" width="419" height="199" rx="18" fill="none" stroke="#0fa896" stroke-opacity=".35"/>
<defs><clipPath id="cc"><rect x=".5" y=".5" width="419" height="199" rx="18"/></clipPath><linearGradient id="glare" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#cc)"><rect class="glare" x="-160" y="-40" width="120" height="280" fill="url(#glare)" transform="skewX(-18)"/><circle cx="390" cy="210" r="90" fill="#0fa896" fill-opacity="0.07"/></g>
<text class="f-mono" x="24" y="38" style="font-size:10.5px;letter-spacing:1.2px" fill="#0fa896">FULL-STACK · POSTGRES</text>
<rect x="340" y="22" width="56" height="22" rx="11" fill="#3ddc97" fill-opacity=".13" stroke="#3ddc97" stroke-opacity=".4"/><circle cx="352" cy="33" r="3" fill="#3ddc97"/><circle class="ping" style="animation-delay:0s" cx="352" cy="33" r="3" fill="none" stroke="#3ddc97"/><text class="f-mono" x="361" y="37" style="font-size:9.5px;letter-spacing:0.8px" fill="#3ddc97">LIVE</text>
<text class="f-title" x="23" y="80" style="font-size:25px;letter-spacing:-0.3px" fill="#edeff8">Campus Hub</text>
<text class="f-sans" x="24" y="106" style="font-size:13.5px" fill="#c4c9dc">Events, QR ticketing and volunteer duty rosters for a</text><text class="f-sans" x="24" y="125.5" style="font-size:13.5px" fill="#c4c9dc">college, with check-in codes that rotate every 30 seconds.</text>
<g><rect x="24" y="156" width="81" height="22" rx="11.0" fill="#0fa896" fill-opacity="0.12" stroke="#0fa896" stroke-opacity=".32"/><text class="f-mono" x="64.5" y="170.78" style="font-size:10.5px" fill="#0fa896" text-anchor="middle">Next.js 16</text></g><g><rect x="111" y="156" width="81" height="22" rx="11.0" fill="#0fa896" fill-opacity="0.12" stroke="#0fa896" stroke-opacity=".32"/><text class="f-mono" x="151.5" y="170.78" style="font-size:10.5px" fill="#0fa896" text-anchor="middle">TypeScript</text></g><g><rect x="198" y="156" width="81" height="22" rx="11.0" fill="#0fa896" fill-opacity="0.12" stroke="#0fa896" stroke-opacity=".32"/><text class="f-mono" x="238.5" y="170.78" style="font-size:10.5px" fill="#0fa896" text-anchor="middle">PostgreSQL</text></g><g><rect x="285" y="156" width="62.1" height="22" rx="11.0" fill="#0fa896" fill-opacity="0.12" stroke="#0fa896" stroke-opacity=".32"/><text class="f-mono" x="316.05" y="170.78" style="font-size:10.5px" fill="#0fa896" text-anchor="middle">Drizzle</text></g>
</svg>
