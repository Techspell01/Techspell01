<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-labelledby="title desc">
<title id="title">MedReminder Circle</title>
<desc id="desc">Health · Realtime. Medication reminders shared with the family members who would actually notice a missed dose. Built with React, Firebase, Firestore, PWA.</desc>
<style><![CDATA[
@font-face{font-family:'HA Mono';font-weight:500;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'HA Title';font-weight:700;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'HA Sans';font-weight:400;src:url(data:font/woff;base64,) format('woff')}

text{font-kerning:normal}
.f-display{font-family:'HA Display','Trebuchet MS',system-ui,sans-serif;font-weight:800}
.f-title{font-family:'HA Title','Trebuchet MS',system-ui,sans-serif;font-weight:700}
.f-sans{font-family:'HA Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400}
.f-semi{font-family:'HA Semi',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.f-mono{font-family:'HA Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.2,.8,.3,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}75%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.glare{animation:glare 9s ease-in-out 3.1s infinite}@keyframes glare{0%{transform:skewX(-18deg) translateX(0)}16%,100%{transform:skewX(-18deg) translateX(740px)}}
]]></style>
<defs><linearGradient id="tint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0457b" stop-opacity=".13"/><stop offset=".6" stop-color="#e0457b" stop-opacity=".02"/></linearGradient></defs><rect x=".5" y=".5" width="419" height="199" rx="18" fill="#10131b"/><rect x=".5" y=".5" width="419" height="199" rx="18" fill="url(#tint)"/><rect x=".5" y=".5" width="419" height="199" rx="18" fill="none" stroke="#e0457b" stroke-opacity=".35"/>
<defs><clipPath id="cc"><rect x=".5" y=".5" width="419" height="199" rx="18"/></clipPath><linearGradient id="glare" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#cc)"><rect class="glare" x="-160" y="-40" width="120" height="280" fill="url(#glare)" transform="skewX(-18)"/><circle cx="390" cy="210" r="90" fill="#e0457b" fill-opacity="0.07"/></g>
<text class="f-mono" x="24" y="38" style="font-size:10.5px;letter-spacing:1.2px" fill="#e0457b">HEALTH · REALTIME</text>
<rect x="340" y="22" width="56" height="22" rx="11" fill="#3ddc97" fill-opacity=".13" stroke="#3ddc97" stroke-opacity=".4"/><circle cx="352" cy="33" r="3" fill="#3ddc97"/><circle class="ping" style="animation-delay:0.9s" cx="352" cy="33" r="3" fill="none" stroke="#3ddc97"/><text class="f-mono" x="361" y="37" style="font-size:9.5px;letter-spacing:0.8px" fill="#3ddc97">LIVE</text>
<text class="f-title" x="23" y="80" style="font-size:25px;letter-spacing:-0.3px" fill="#edeff8">MedReminder Circle</text>
<text class="f-sans" x="24" y="106" style="font-size:13.5px" fill="#c4c9dc">Medication reminders shared with the family members who</text><text class="f-sans" x="24" y="125.5" style="font-size:13.5px" fill="#c4c9dc">would actually notice a missed dose.</text>
<g><rect x="24" y="156" width="49.5" height="22" rx="11.0" fill="#e0457b" fill-opacity="0.12" stroke="#e0457b" stroke-opacity=".32"/><text class="f-mono" x="48.75" y="170.78" style="font-size:10.5px" fill="#e0457b" text-anchor="middle">React</text></g><g><rect x="79.5" y="156" width="68.4" height="22" rx="11.0" fill="#e0457b" fill-opacity="0.12" stroke="#e0457b" stroke-opacity=".32"/><text class="f-mono" x="113.7" y="170.78" style="font-size:10.5px" fill="#e0457b" text-anchor="middle">Firebase</text></g><g><rect x="153.9" y="156" width="74.7" height="22" rx="11.0" fill="#e0457b" fill-opacity="0.12" stroke="#e0457b" stroke-opacity=".32"/><text class="f-mono" x="191.25" y="170.78" style="font-size:10.5px" fill="#e0457b" text-anchor="middle">Firestore</text></g><g><rect x="234.6" y="156" width="36.9" height="22" rx="11.0" fill="#e0457b" fill-opacity="0.12" stroke="#e0457b" stroke-opacity=".32"/><text class="f-mono" x="253.05" y="170.78" style="font-size:10.5px" fill="#e0457b" text-anchor="middle">PWA</text></g>
</svg>
