<svg xmlns="http://www.w3.org/2000/svg" width="142" height="50" viewBox="0 0 142 50" role="img" aria-labelledby="title desc">
<title id="title">Email</title>
<desc id="desc">Email button</desc>
<style><![CDATA[
@font-face{font-family:'Press Start 2P';font-weight:400;src:url(data:font/woff;base64,) format('woff')}

.f-pixel{font-family:'Press Start 2P',ui-monospace,Consolas,monospace;font-weight:400}
.f-body{font-family:'VT323',ui-monospace,Consolas,monospace;font-weight:400}
.px{shape-rendering:crispEdges}
.blink{animation:blink 1s steps(1) infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s steps(3) both}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.press{animation:press 4s steps(1) 1.2s infinite}@keyframes press{0%,8%{transform:none}9%,15%{transform:translateY(5px)}16%,100%{transform:none}}
]]></style>
<path class="px" d="M4 0H138V4H142V46H138V50H4V46H0V4H4Z" fill="#000000"/>
<path class="px" d="M6 3H136V6H139V44H136V47H6V44H3V6H6Z" fill="#7e2553"/>
<g class="press"><path class="px" d="M6 3H136V6H139V37H136V40H6V37H3V6H6Z" fill="#ff004d"/><rect class="px" x="7" y="6" width="128" height="3" fill="#fff" fill-opacity=".35"/><g class="px"><path fill="#fff1e8" d="M16 13h16v2h-16zM16 15h4v2h-4zM28 15h4v2h-4zM16 17h2v2h-2zM20 17h2v2h-2zM26 17h2v2h-2zM30 17h2v2h-2zM16 19h2v2h-2zM22 19h4v2h-4zM30 19h2v2h-2zM16 21h2v2h-2zM30 21h2v2h-2zM16 23h16v2h-16z"/></g><text class="f-pixel" x="44" y="30" style="font-size:16px" fill="#fff1e8">EMAIL</text></g>
</svg>
