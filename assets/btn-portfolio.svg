<svg xmlns="http://www.w3.org/2000/svg" width="206" height="50" viewBox="0 0 206 50" role="img" aria-labelledby="title desc">
<title id="title">Portfolio</title>
<desc id="desc">Portfolio button</desc>
<style><![CDATA[
@font-face{font-family:'Press Start 2P';font-weight:400;src:url(data:font/woff;base64,) format('woff')}

.f-pixel{font-family:'Press Start 2P',ui-monospace,Consolas,monospace;font-weight:400}
.f-body{font-family:'VT323',ui-monospace,Consolas,monospace;font-weight:400}
.px{shape-rendering:crispEdges}
.blink{animation:blink 1s steps(1) infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s steps(3) both}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.press{animation:press 4s steps(1) 0s infinite}@keyframes press{0%,8%{transform:none}9%,15%{transform:translateY(5px)}16%,100%{transform:none}}
]]></style>
